<!DOCTYPE html>
<html lang="vi" style="--color-primary: #8B1E24; --bg-card: #FFFFFF; --color-gold: #C5A059; --font-script: 'Great Vibes', cursive;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiệp Cưới Online | Trần Quang Anh &amp; Trần Thị Thanh Thư</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Great+Vibes&amp;family=Montserrat:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,500;0,700;1,400&amp;family=Alex+Brush&display=swap" rel="stylesheet">
  
  <style id="dynamic-theme-styles">
    :root {
      --bg-outer: #F4F1EA;
      --bg-card: #FFFFFF;
      --bg-soft: #FAF8F5;
      --color-primary: #8B1E24;
      --color-gold: #C5A059;
      --color-text: #2C2623;
      --font-script: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'Montserrat', sans-serif;
    }
    body {
      background-color: var(--bg-outer);
      color: var(--color-text);
      font-family: var(--font-sans);
      overflow-x: hidden;
      margin: 0;
    }
    .font-script { font-family: var(--font-script); }
    .font-serif-title { font-family: var(--font-serif); }
    .font-sans-body { font-family: var(--font-sans); }

    .nowrap-name {
      white-space: nowrap;
      display: inline-block;
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1), transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #envelope-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: linear-gradient(145deg, #FFFFFF 0%, #FAF6F0 55%, #F3ECE1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.9s ease;
    }
    #envelope-overlay.opened {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .wax-seal-btn {
      cursor: pointer;
      transition: transform 0.35s ease, filter 0.35s ease;
      filter: drop-shadow(0 12px 20px rgba(120, 10, 18, 0.38));
    }
    .wax-seal-btn:hover {
      transform: scale(1.07);
      filter: drop-shadow(0 16px 26px rgba(120, 10, 18, 0.5));
    }

    .photo-frame-box {
      position: relative;
      overflow: hidden;
      background-color: #F7F4EE;
      border: 1px solid rgba(197, 160, 89, 0.35);
      transition: all 0.3s ease;
    }
    .photo-frame-box img {
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }
    .frame-arch { border-radius: 180px 180px 14px 14px; }
    .frame-rounded { border-radius: 16px; }
    .frame-oval { border-radius: 50%; }
    .frame-classic { border-radius: 4px; }

    body.admin-mode [contenteditable="true"] {
      outline: 1px dashed rgba(139, 30, 36, 0.45);
      border-radius: 4px;
      padding: 1px 4px;
      cursor: text;
    }
    body.admin-mode [contenteditable="true"]:focus {
      outline: 2px solid var(--color-primary);
      background: rgba(255, 250, 240, 0.85);
    }
    .admin-only { display: none !important; }
    body.admin-mode .admin-only { display: flex !important; }
    body.admin-mode .admin-only-block { display: block !important; }
    .admin-only-block { display: none !important; }

    .petal {
      position: fixed;
      top: -10%;
      z-index: 40;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0.85; }
      50% { transform: translateY(50vh) rotate(180deg) translateX(22px); opacity: 0.7; }
      100% { transform: translateY(108vh) rotate(360deg) translateX(-18px); opacity: 0; }
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-100 selection:text-red-900">

  <script id="baked-wedding-config">
    window.BAKED_WEDDING_DATA = null;
  </script>

  <!-- BÌA PHONG BÌ MỞ THIỆP -->
  <div id="envelope-overlay" class="px-4 text-center">
    <div class="max-w-md w-full bg-white/95 backdrop-blur-md border border-[#C5A059]/40 rounded-3xl p-8 md:p-10 shadow-[0_20px_60px_rgba(197,160,89,0.18)] relative overflow-hidden">
      <div class="absolute inset-3 border border-[#C5A059]/25 rounded-2xl pointer-events-none"></div>
      
      <p id="env-invite-label" class="text-xs uppercase tracking-[0.28em] text-[#8B6F3B] mb-2 font-medium">TRÂN TRỌNG KÍNH MỜI</p>
      <h2 id="env-guest-name" class="font-serif-title text-2xl md:text-3xl font-semibold text-[#8B1E24] mb-4">Quý Khách</h2>

      <!-- Con Dấu Sáp nằm ở giữa Quý Khách và Tên Cô Dâu Chú Rể -->
      <div class="my-3 flex justify-center">
        <button onclick="openInvitation()" class="wax-seal-btn focus:outline-none group" title="Chạm để mở thiệp">
          <div id="wax-seal-wrapper" class="w-24 h-24 md:w-28 md:h-28 mx-auto flex items-center justify-center">
            <svg viewBox="0 0 220 210" class="w-full h-full">
              <defs>
                <radialGradient id="waxRedGrad" cx="35%" cy="30%" r="70%">
                  <stop offset="0%" stop-color="#D92B38"/>
                  <stop offset="40%" stop-color="#9E0B16"/>
                  <stop offset="80%" stop-color="#68040B"/>
                  <stop offset="100%" stop-color="#3E0105"/>
                </radialGradient>
                <radialGradient id="waxInnerRim" cx="45%" cy="38%" r="60%">
                  <stop offset="0%" stop-color="#75050D"/>
                  <stop offset="70%" stop-color="#9E0E18"/>
                  <stop offset="100%" stop-color="#4A0207"/>
                </radialGradient>
                <filter id="waxGloss" x="-10%" y="-10%" width="120%" height="120%">
                  <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
                  <feSpecularLighting in="blur" surfaceScale="6" specularConstant="1.1" specularExponent="28" lighting-color="#ffffff" result="specOut">
                    <fePointLight x="65" y="45" z="95"/>
                  </feSpecularLighting>
                  <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
                  <feComposite in="SourceGraphic" in2="specOut2" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0"/>
                </filter>
              </defs>
              <path filter="url(#waxGloss)" fill="url(#waxRedGrad)" d="M110,196 C101,191 20,136 14,72 C9,25 46,8 78,16 C95,20 105,31 110,39 C115,31 125,20 142,16 C174,8 211,25 206,72 C200,136 119,191 110,196 Z"/>
              <path fill="url(#waxInnerRim)" stroke="#F498A0" stroke-opacity="0.32" stroke-width="2" d="M110,174 C102,168 35,122 30,72 C26,35 55,23 80,29 C96,33 105,43 110,51 C115,43 124,33 140,29 C165,23 194,35 190,72 C185,122 118,168 110,174 Z"/>
              <path filter="url(#waxGloss)" fill="url(#waxRedGrad)" stroke="#FFCDD2" stroke-opacity="0.35" stroke-width="1.4" d="M110,138 C105,134 66,106 63,76 C60,55 77,47 92,51 C101,53 107,60 110,65 C113,60 119,53 128,51 C143,47 160,55 157,76 C154,106 115,134 110,138 Z"/>
              <path fill="rgba(255,255,255,0.28)" d="M46,42 C58,28 76,27 86,33 C72,35 54,44 45,62 C41,54 42,47 46,42 Z"/>
              <path fill="rgba(255,255,255,0.22)" d="M80,66 C87,58 96,58 101,62 C93,63 85,68 80,77 C78,72 78,69 80,66 Z"/>
            </svg>
          </div>
          <span class="block mt-2 text-xs tracking-[0.22em] uppercase text-[#8B1E24] font-semibold group-hover:underline">Chạm mở thiệp</span>
        </button>
      </div>

      <!-- Tên Cô Dâu & Chú Rể nằm ở dưới sáp -->
      <div class="mt-3 mb-2">
        <p class="font-script text-3xl md:text-4xl text-[#2C2623] leading-tight nowrap-name">Trần Quang Anh</p>
        <p class="font-serif-title italic text-sm text-[#C5A059] my-0.5">&amp;</p>
        <p class="font-script text-3xl md:text-4xl text-[#2C2623] leading-tight nowrap-name">Trần Thị Thanh Thư</p>
      </div>

      <p id="env-event-summary" class="text-xs text-stone-500 tracking-wider mt-2">02.11.2026 &bull; 07.11.2026</p>
    </div>
  </div>

  <!-- NÚT ĐIỀU KHIỂN NHẠC NỀN & KHUNG NHÚNG ZING MP3 -->
  <div class="fixed bottom-5 left-5 z-50 flex items-center gap-2">
    <button id="music-toggle-btn" onclick="toggleMusic()" class="px-3.5 h-11 rounded-full bg-white/95 border border-[#C5A059] shadow-lg flex items-center gap-2 text-[#8B1E24] hover:scale-105 transition" title="Bật/Tắt nhạc nền">
      <svg id="music-icon-on" class="w-4 h-4 animate-spin hidden" style="animation-duration: 5s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l
